<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--accent:#d4fc50;--dark:#0d0d0d;--ink:#f2f2f2;--sub:rgba(242,242,242,.58)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--dark);overflow:hidden;-webkit-font-smoothing:antialiased}
.stage{width:2000px;height:2000px;position:relative;overflow:hidden;background:
  radial-gradient(58% 48% at 50% 30%,rgba(212,252,80,.20),transparent 62%),
  radial-gradient(50% 44% at 84% 88%,rgba(212,252,80,.10),transparent 60%),
  #0d0d0d}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
/* glassy lime omega — echoes the PONS glass letterform */
.mark{font-family:'Instrument Serif',Georgia,serif;font-size:1080px;line-height:.86;
  background:linear-gradient(165deg,#ffffff 3%,#f2ffd2 22%,var(--accent) 56%,#8fae2e 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(255,255,255,.14)) drop-shadow(0 24px 90px rgba(212,252,80,.55))}
.name{font-family:'Instrument Serif',Georgia,serif;font-size:196px;letter-spacing:8px;margin-top:26px;color:var(--ink)}
.badge{margin-top:34px;font-size:66px;font-weight:800;letter-spacing:2px;color:#111;background:var(--accent);border-radius:999px;padding:20px 62px;box-shadow:0 18px 60px rgba(212,252,80,.4)}
</style></head>
<body><div class="stage"><div class="wrap">
  <div class="mark">Ω</div>
  <div class="name">PONSI</div>
  <div class="badge">(3,3)</div>
</div></div></body></html>
